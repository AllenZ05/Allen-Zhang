name: Website checks

on:
  push:
    paths: ["Allen-Zhang/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["Allen-Zhang/**", ".github/workflows/website.yml"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            os: ubuntu-latest
          # Safari's engine on macOS, as Mac and iPhone visitors get it; its Linux build behaves differently.
          - browser: webkit
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Allen-Zhang
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: Allen-Zhang/.nvmrc
          cache: npm
          cache-dependency-path: Allen-Zhang/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
